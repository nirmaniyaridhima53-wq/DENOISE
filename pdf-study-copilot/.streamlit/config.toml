# ============================================================
# STREAMLIT CONFIGURATION — Research OS theme
# ============================================================

[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#070913"
secondaryBackgroundColor = "#0E1322"
textColor = "#F9FAFB"
font = "sans serif"

[server]
maxUploadSize = 50
headless = true
enableXsrfProtection = true
runOnSave = true
port = 8501

[browser]
gatherUsageStats = false
